name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
concurrency: {group: production-release, cancel-in-progress: false}
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository_owner != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.22.0}
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter @rogimarble/web test
      - run: pnpm --filter @rogimarble/api test:auth
      - run: pnpm --filter @rogimarble/api test:effects
      - run: pnpm --filter @rogimarble/api test:collector
      - run: pnpm --filter @rogimarble/api test:feed
      - run: pnpm --filter @rogimarble/api test:pawn
      - run: pnpm --filter @rogimarble/api test:integration
      - run: pnpm build
        env: {NEXT_PUBLIC_API_BASE_URL: 'https://marble-api.rogi.chat', NEXT_PUBLIC_CHANNEL_ID: preview}
      - run: python3 tools/ops/test_release.py && python3 tools/ops/test_fetch_release.py && python3 tools/ops/test_runtime_secrets.py && python3 tools/ops/test_prepare_collector_client.py && python3 tools/ops/test_backup.py && python3 tools/ops/test_registry_auth.py && python3 tools/ops/test_production_status.py && python3 tools/release/test-validate-compose.py
      - run: python3 tools/release/validate-compose.py
      - id: release_state
        name: Preserve an existing immutable release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash
        run: |
          tag="production-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$tag" --dir existing-release --pattern release-bundle.tar.gz --pattern release-bundle.tar.gz.sha256
            (cd existing-release && sha256sum -c release-bundle.tar.gz.sha256)
            mkdir existing-release/unpacked
            tar -xzf existing-release/release-bundle.tar.gz -C existing-release/unpacked
            python3 -c 'import json,os; assert json.load(open("existing-release/unpacked/manifest.build.json"))["sourceSha"] == os.environ["GITHUB_SHA"]'
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.release_state.outputs.exists != 'true'
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        if: steps.release_state.outputs.exists != 'true'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: names
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: api
        if: steps.release_state.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: 'ghcr.io/${{ steps.names.outputs.owner }}/rogimarble-api:sha-${{ github.sha }}'
      - id: web
        if: steps.release_state.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: 'ghcr.io/${{ steps.names.outputs.owner }}/rogimarble-web:sha-${{ github.sha }}'
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://marble-api.rogi.chat
            NEXT_PUBLIC_CHANNEL_ID=preview
      - name: Build checksummed release bundle
        if: steps.release_state.outputs.exists != 'true'
        env:
          SOURCE_SHA: '${{ github.sha }}'
          IMAGE_API: 'ghcr.io/${{ steps.names.outputs.owner }}/rogimarble-api@${{ steps.api.outputs.digest }}'
          IMAGE_WEB: 'ghcr.io/${{ steps.names.outputs.owner }}/rogimarble-web@${{ steps.web.outputs.digest }}'
          IMAGE_CADDY: '${{ vars.CADDY_IMAGE }}'
          IMAGE_POSTGRES: '${{ vars.POSTGRES_IMAGE }}'
          IMAGE_REDIS: '${{ vars.REDIS_IMAGE }}'
        run: python3 tools/release/build-bundle.py
      - name: Attest release bundle provenance
        if: steps.release_state.outputs.exists != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/release/release-bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release_state.outputs.exists != 'true'
        with: {name: rogimarble-production-release, path: 'dist/release/*', if-no-files-found: error, retention-days: 30}
      - name: Publish anonymous release assets
        if: steps.release_state.outputs.exists != 'true'
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash
        run: |
          tag="production-${GITHUB_SHA}"
          gh release create "$tag" dist/release/release-bundle.tar.gz dist/release/release-bundle.tar.gz.sha256 --target "$GITHUB_SHA" --title "$tag" --notes "Immutable production feedback release for $GITHUB_SHA"
