name: ${COMPOSE_PROJECT_NAME:-rogimarble-preview}

x-app-runtime: &app-runtime
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: [node, --experimental-strip-types, packages/database/src/migrate.ts]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  api:
    <<: *app-runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy/.env}
      COOKIE_SECURE: "false"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:${EDGE_PORT:-8080}}
    expose: ["4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [edge, data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/ready',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    <<: *app-runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_CHANNEL_ID: ${NEXT_PUBLIC_CHANNEL_ID:-preview}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    networks: [edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - ${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-8080}:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [edge]
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
    internal: false
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
